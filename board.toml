# UniXNU board description for OnePlus Pad Pro (caihong, SM8650)
# target: iPadOS 26.5.2 (23F84) — profile ipados-26.5.2-23F84, arch arm64e
#
# 与 tenku-png/Axiang-dev 的 iPad 17.7.11 版本的差异，全部集中在下面标注 [26] 的地方：
#   - [ipsw]        换成 iPad17,3 / j820ap / 26.5.2 / 23F84 / chip_id 33090
#   - [userdata]    **改成 unixnu 分区**（90,231,552–123,785,983），不再用 userdata，
#                   这样 Android 的 /data 完全不经手
#   - [kernel]      arm64e defconfig（26 profile 是 PAC/PPL 全开，17 版是 arm64）
#   - [kernel.prelink] kernelcache sha256 / early_security_init / roots 按 26 profile
#   - [payload.adt] root_match_volume_uuid = 26 profile 的 OS 卷 UUID（APFS，不是 HFS+）
#
# 未验证项（需要一次真实构建才能定）：
#   * [ipsw.sha256] 的两条 dmg 摘要要从本机 IPSW 的 BuildManifest 里取
#   * [bootimg.image] base/pagesize 取自 uefi-caihong 的 Mu-Silicium 配置，17 版用的是 0xA7100000
#   * [kernel] archives 里 build-*- 脚本与 26 profile 的 component 名对应关系

[board]
name = "caihong"
soc = "SM8650"
description = "OnePlus Pad Pro (OPD2404), Snapdragon 8 Gen 3"
kit = "caihong"

[ipsw]
# [26] 来自 UniXNU profiles/os/ipados-26.5.2-23F84/profile.toml（逐字复制）
url = "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-25976/000BB0A6-045B-47FF-AE4E-D8BF722E24FD/iPad17,1,iPad17,2,iPad17,3,iPad17,4_26.5.2_23F84_Restore.ipsw"
product = "iPad17,3"
version = "26.5.2"
build = "23F84"
device_class = "j820ap"
chip_id = 33090          # 0x8132
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
# TODO(26): 从 IPSW 的 BuildManifest.plist 读出 OS / SystemOS 两个 dmg 的 Digest，填在这里
# "140-xxxxx-xxx.dmg" = "..."
# "140-xxxxx-xxx.dmg" = "..."

[userdata]
# [26] **root 落在独立的 unixnu 分区**（实测 GPT，4 KiB LBA）：
#   unixnu  first_lba 90,231,552  last_lba 123,785,983  33,554,432 扇区 = 128.00 GiB
# 不动 userdata（3,769,068–90,231,551）。刷写命令必须是
#   fastboot flash unixnu <img>
# 任何指向 userdata 的镜像一律拒绝。
first_lba = 90231552
last_lba = 123785983
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "caihong_ipados26_defconfig"    # [26] arm64e；需从 sheng_ipados26_defconfig 派生
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
  "build-arm-driver.py CaihongPmgrNub",
  "build-native-mobile-display.py",
  "build-sheng-ufs.py",
]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# [26] 23F84 原始 kernelcache（解 LZFSE 后 arm64e slice）的 sha256
kernelcache_sha256 = "0f7d50ac1bfc7cdbfc3acf5ed4934b5d5abbadee243dafb8d7487ca38b445066"
slide = "-0x1000000"
# [26] 23F84 里 AMFI start 是空 __realmain trampoline，内核补丁改调原始入口
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffe0008f13c80"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "caihong"
dsc = "Platforms/OnePlus/caihongPkg/caihong.dsc"
fd = "Build/caihongPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Common/Mu",
  "{uefi}/Platforms/OnePlus",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
DEVICE_MODEL = "caihong"

[bootimg.image]
# 与 uefi-caihong 的 Resources/Configs/caihong.toml [uefi_fd] base/size 必须一致
base = 0xA7100000
pagesize = 4096
header_version = 4

[payload]
volume = "CAIHONGESP"
size_mib = 384
loader = "firmware"
title = "OnePlus Pad Pro (caihong)"
dram_size = "0x80000000"
panic_screen = true
timeout = 3
kernel_args = ["-v", "serial=3"]

[payload.adt]
tool = "scripts/make-caihong-adt.py"
# [26] 26 profile 的 OS 卷是 APFS，UUID 来自 profile.toml [root]
root_match_volume_uuid = "546DFF4A-4172-4026-9F1B-7FDAD45F3D2E"
chip_id = "0x8132"           # 33090
owned_memory_size = "0x80000000"
cpu_regs = "0"
psci_method = "smc"
packed_data_ramdisk = false
ipad_identity = true
unique_chip_id = "required"
